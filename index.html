<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9G5TLHQGLV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-9G5TLHQGLV');
    </script>
</head>
<body>
    <header>
        <h1>My Broadcast Portfolio</h1>
    </header>
    
    <section id="reel">
        <h2>My Casting Reel</h2>
    	<video id="videoPlayer" width="560" height="315" controls>
        	<source id="videoSource" src="videos/video1.mp4" type="video/mp4">
        	Your browser does not support the video tag.
    	</video>
    	<br>
    	<button id="prevVideo">Previous</button>
    	<button id="nextVideo">Next</button>
    </section>
    
    <section id="broadcast-data">
        <h2>Broadcast Data</h2>
        <table id="data-table">
            <thead>
                <tr>
                    <th>Game</th>
                    <th>Organiser</th>
                    <th>Role</th>
                    <th>Date</th>
                    <th>Hours</th>
                    <th>Stream</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be loaded dynamically from spreadsheet -->
            </tbody>
        </table>
    </section>
    
    <script src="script.js"></script> 
</body>
</html>
